<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Image Joiner for Background Rotator Tweak</title>
  <script src="../assets/vendor/jquery.min.js"></script>
  <script src="../assets/vendor/jquery.mousewheel.min.js"></script>
  <script src="../assets/vendor/angular.min.js"></script>
  <script src="./PhotoJoiner_files/jquery-ui.js"></script>
  <script src="./PhotoJoiner_files/colorpicker.js"></script>
  <script src="./PhotoJoiner_files/TableFunctions.js"></script>
  <script src="./PhotoJoiner_files/PhotoJoin.js"></script>
  <link rel="stylesheet" href="./PhotoJoiner_files/Style.css">
  <link rel="stylesheet" href="./PhotoJoiner_files/colorpicker.css">
  <link rel="stylesheet" href="../assets/css/index.css">
  <link rel="stylesheet" href="../assets/vendor/w3.css">
  <style>html{overflow-x:auto} .topgap{display:none!important} body{margin-top:20px}</style>
</head>
<body id="PhotoJoiner" ng-controller="JoinerCtrl">
  <div ng-include="'PhotoJoiner/PhotoJoiner.html'"></div>
  <p id="startup-error" role="alert"></p>
<script>
function externalLink () { document.getElementById('startup-error').textContent = 'Legacy links are disabled.' }
function writeRotatorVars (images) { aio.setBackgroundRotator(images, Number($('#bgRotatorSeconds').val())).catch(error => { document.getElementById('startup-error').textContent = error.message }) }
async function selectJoinedImage () {
  try { joinedPhoto(await aio.chooseJoinedImage()) } catch (error) { document.getElementById('startup-error').textContent = error.message }
}
window.secondaryStartup = aio.secondaryBootstrap().then(data => {
  angular.module('Joiner', []).controller('JoinerCtrl', function ($scope) {
    $scope.appVer = data.app.version; $scope.imgOps = data.labels.imgOps; $scope.menu = data.labels.menu
  })
  angular.bootstrap(document, ['Joiner'])
}).catch(error => { document.getElementById('startup-error').textContent = error.message; throw error })
</script>
</body>
</html>
